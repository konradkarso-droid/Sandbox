name: Проверка Sandbox с Astra

on:
  workflow_dispatch:
    inputs:
      live:
        description: Вызвать настоящую Astra (расход API-кредитов)
        type: boolean
        default: false
      extended:
        description: Выполнить шесть сценариев изоляции (требует live)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sandbox:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prostranstvo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Проверка установки без облачных запросов
        run: |
          set -o pipefail
          python3 start.py --check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Тесты границ с локальным получателем
        run: |
          set -o pipefail
          .venv/bin/python3 -m pip install pytest
          .venv/bin/python3 -m pytest -q -rs tests/test_app.py tests/test_gateway.py tests/test_exchange.py \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Прогон оплачиваемого файлового обмена с Astra
        if: inputs.live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASTRA_EXTENDED: ${{ inputs.extended }}
        run: |
          set -o pipefail
          args=()
          if [[ "$ASTRA_EXTENDED" == "true" ]]; then
            args+=(--extended)
          fi
          .venv/bin/python3 -m experiments.astra_acceptance "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
