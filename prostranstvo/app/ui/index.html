<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пространство — песочница для ИИ-агентов</title>
<!--
  Экран песочницы «Пространство». Раскладка своя, для компьютера: настройка
  слева, прогон справа; на узком экране — одно под другим. От приложения
  агента взяты только цвета (docs/pesochnitsa_specifikatsiya.md, §6).
  Два языка: строки экрана — в словаре T ниже; сценарии и законы приходят
  с сервера (app/texts.py) сразу на обоих.
  Страница ничего не решает за среду: она шлёт настройки и показывает то,
  что прочитано из журнала. Законы проверяет наблюдатель.
-->
<style>
  :root {
    --page: #EAF3F6; --card: #FFFFFF; --text: #123540; --text2: #3A6470; --muted: #7FA3AE;
    --primary: #17697B; --primary-soft: #DDF0F2; --stop: #D6453E; --alarm-bg: #FBE3E1; --alarm: #A3231D;
    --model: #5B4B9E; --model-soft: #ECE9F7; --block: #EDF3F4; --rule: #9BB0B5; --na: #FCE8B8; --off: #C9DAE0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border: 0; cursor: pointer; border-radius: 8px; }
  button:disabled { cursor: default; opacity: .45; }
  a { color: var(--primary); }
  .hidden { display: none !important; }

  header { background: var(--card); border-bottom: 1px solid var(--block); }
  header .in { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
  .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--primary); position: relative; flex: none; }
  .mark::after { content: ""; position: absolute; inset: 8px; border: 2px solid #fff; border-radius: 3px; }
  .brand b { font-size: 17px; }
  .brand span { color: var(--text2); margin-left: 8px; }
  .spacer { flex: 1; }
  .link { background: none; color: var(--primary); padding: 6px 8px; }
  .lang { display: flex; background: var(--block); border-radius: 8px; padding: 3px; }
  .lang button { background: none; padding: 4px 10px; font-size: 13px; color: var(--text2); }
  .lang button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(18,53,64,.15); }

  main { max-width: 1240px; margin: 0 auto; padding: 20px; display: grid; gap: 20px;
    grid-template-columns: 420px 1fr; align-items: start; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }

  .card { background: var(--card); border-radius: 12px; padding: 18px; }
  .card + .card { margin-top: 14px; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .step { color: var(--muted); font-weight: 400; margin-right: 6px; }
  .lead { color: var(--text2); margin: 0 0 12px; font-size: 14px; }
  .small { font-size: 13px; color: var(--text2); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--block); border-radius: 10px; padding: 4px; margin-top: 8px; }
  .seg button { background: none; padding: 9px 6px; color: var(--text2); border-radius: 7px; text-align: center; }
  .seg button b { display: block; font-weight: 600; }
  .seg button span { display: block; font-size: 12px; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(18,53,64,.15); }
  .seg button.on b { color: var(--primary); }
  .explain { background: var(--block); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text2); margin: 12px 0; }

  label.f { display: block; font-size: 13px; color: var(--text2); margin-top: 12px; }
  input[type=text], input[type=password], input[type=number], input[type=url], select, textarea {
    width: 100%; background: var(--card); border: 1px solid var(--off); border-radius: 8px; padding: 8px 10px; margin-top: 4px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  textarea { resize: vertical; min-height: 90px; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .row > input { flex: 1; }
  .btn2 { background: var(--block); color: var(--primary); padding: 8px 12px; margin-top: 4px; white-space: nowrap; }
  .btn2:hover:not(:disabled) { background: var(--primary-soft); }
  .out { font-size: 13px; margin-top: 6px; color: var(--text2); min-height: 1em; word-break: break-word; }
  .out.bad { color: var(--alarm); }
  .out.good { color: var(--primary); }

  .choice { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--block); border-radius: 10px; margin-top: 8px; cursor: pointer; }
  .choice:hover { border-color: var(--off); }
  .choice.on { border-color: var(--primary); background: #F6FBFC; }
  .choice input { accent-color: var(--primary); margin-top: 3px; }
  .choice b { display: block; font-weight: 600; }
  .choice span { display: block; font-size: 13px; color: var(--text2); }
  .counter { text-align: right; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .counter.over { color: var(--alarm); }

  details.params summary { cursor: pointer; font-weight: 600; list-style: none; }
  details.params summary::-webkit-details-marker { display: none; }
  details.params summary::before { content: "▸"; color: var(--muted); margin-right: 8px; }
  details.params[open] summary::before { content: "▾"; }
  .param .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .start { width: 100%; background: var(--primary); color: #fff; font-size: 16px; font-weight: 600; padding: 13px; margin-top: 16px; border-radius: 10px; }
  .start:hover:not(:disabled) { filter: brightness(1.08); }
  .why { font-size: 13px; color: var(--text2); margin-top: 8px; text-align: center; min-height: 1em; }

  .how ol { margin: 8px 0 0; padding-left: 22px; }
  .how li { margin-bottom: 8px; }
  .how .em { color: var(--primary); font-weight: 600; }
  .note { border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; white-space: pre-wrap; }
  .note.warn { background: var(--na); }
  .note.bad { background: var(--alarm-bg); color: var(--alarm); }

  .status { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .status .what { flex: 1; min-width: 220px; }
  .status .state { font-weight: 600; }
  .status .act { color: var(--primary); font-size: 14px; font-variant-numeric: tabular-nums; }
  .stopbtn { background: var(--card); color: var(--stop); border: 1.5px solid var(--stop); padding: 8px 14px; font-weight: 600; }
  .stopbtn:hover:not(:disabled) { background: var(--alarm-bg); }
  .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
  .num { background: var(--block); border-radius: 10px; padding: 10px 12px; }
  .num .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .num .k { font-size: 12px; color: var(--text2); }
  .bar { height: 6px; background: var(--off); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--primary); }

  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tabs button { background: var(--block); color: var(--text2); padding: 6px 12px; }
  .tabs button.on { background: var(--primary); color: #fff; }
  .turn { border-top: 1px solid var(--block); padding: 12px 0; }
  .turn:first-child { border-top: 0; }
  .turn .top { display: flex; align-items: baseline; gap: 10px; }
  .turn .no { color: var(--muted); font-size: 13px; min-width: 52px; flex: none; }
  .turn .secs { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .said { font: 13.5px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; background: var(--model-soft);
    color: var(--model); padding: 2px 8px; border-radius: 6px; word-break: break-word; }
  .said.none { background: var(--block); color: var(--muted); font-family: inherit; font-style: italic; }
  .means { margin: 6px 0 0 62px; font-size: 14px; }
  .fx { margin: 4px 0 0 62px; font-size: 14px; }
  .fx div { padding-left: 18px; position: relative; }
  .fx div::before { position: absolute; left: 0; }
  .fx .ok::before { content: "✓"; color: var(--primary); }
  .fx .bad { color: var(--alarm); }
  .fx .bad::before { content: "✗"; }
  .fx .info::before { content: "·"; color: var(--muted); }
  .fx .agent { color: var(--muted); font-style: italic; }
  .cut { margin: 6px 0 0 62px; font-size: 14px; color: var(--alarm); }
  .fx .agent::before { content: "↳"; }
  details.raw { margin: 6px 0 0 62px; }
  details.raw summary { font-size: 12px; color: var(--muted); cursor: pointer; }
  pre { background: var(--block); border-left: 3px solid var(--rule); border-radius: 6px; padding: 8px 10px; margin: 6px 0;
    font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow: auto; }
  pre.m { border-left-color: var(--model); }
  .pre0 { color: var(--text2); font-size: 14px; }

  .verdict { border-radius: 10px; padding: 14px 16px; }
  .verdict.ok { background: var(--primary-soft); color: var(--primary); }
  .verdict.bad { background: var(--alarm-bg); color: var(--alarm); }
  .verdict b { font-size: 18px; display: block; }
  .group { border-top: 1px solid var(--block); padding: 10px 0; }
  .group .gh { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .group .gh span.t { font-weight: 600; }
  .group .gh span.c { margin-left: auto; font-size: 13px; color: var(--muted); }
  .group .ga { font-size: 13px; color: var(--text2); margin: 2px 0 0 20px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: #E2C46E; }
  .dot.h { background: var(--primary); } .dot.b { background: var(--stop); }
  .law { display: flex; gap: 10px; margin: 8px 0 0 20px; font-size: 14px; }
  .law .key { color: var(--muted); font-size: 12px; min-width: 50px; padding-top: 2px; margin-left: auto; }
  .law .st { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header><div class="in">
  <div class="mark"></div>
  <div class="brand"><b data-t="title"></b><span data-t="subtitle"></span></div>
  <div class="spacer"></div>
  <button class="link" id="btnHow" data-t="how_link"></button>
  <div class="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
</div></header>

<main>
  <section id="setup">
    <div class="card">
      <h2><span class="step">1</span><span data-t="model_h"></span></h2>
      <div class="seg" id="seg">
        <button data-c="сомкнутый"><b data-t="local"></b><span data-t="local_sub"></span></button>
        <button data-c="разомкнутый"><b data-t="cloud"></b><span data-t="cloud_sub"></span></button>
      </div>
      <div class="explain" id="contourExplain"></div>

      <div id="localBox">
        <div id="localList"></div>
        <label class="f"><span data-t="path_l"></span>
          <input type="text" id="path" spellcheck="false" placeholder="/home/…/model.gguf"></label>
        <label class="f"><span data-t="url_l"></span>
          <div class="row"><input type="url" id="url" spellcheck="false" placeholder="https://huggingface.co/…/model.gguf">
            <button class="btn2" id="btnDl" data-t="download"></button></div></label>
        <div class="out" id="dlOut"></div>
        <div class="out bad" id="engineOut"></div>
      </div>

      <div id="cloudBox" class="hidden">
        <label class="f"><span data-t="provider_l"></span><select id="preset"></select></label>
        <label class="f"><span data-t="address_l"></span><input type="text" id="base" spellcheck="false"></label>
        <label class="f"><span data-t="modelname_l"></span>
          <div class="row"><input type="text" id="model" list="modelList" spellcheck="false">
            <button class="btn2" id="btnModels" data-t="list"></button></div></label>
        <datalist id="modelList"></datalist>
        <label class="f"><span data-t="key_l"></span><input type="password" id="key" autocomplete="off"></label>
        <div class="out" id="keyOut"></div>
        <button class="btn2" id="btnCheck" data-t="check"></button>
        <div class="out" id="checkOut"></div>
      </div>
    </div>

    <div class="card">
      <h2><span class="step">2</span><span data-t="agent_h"></span></h2>
      <label class="choice" id="chBuiltin"><input type="radio" name="ag" value="builtin" checked>
        <div><b data-t="builtin"></b><span data-t="builtin_about"></span></div></label>
      <div id="builtinBox" style="margin-left:34px">
        <label class="f"><span data-t="rules_lang"></span>
          <select id="agentLang"><option value="ru" data-t="rules_ru"></option><option value="en" data-t="rules_en"></option></select></label>
      </div>
      <label class="choice" id="chOwn"><input type="radio" name="ag" value="own">
        <div><b data-t="own_agent"></b><span data-t="own_agent_about"></span></div></label>
      <div id="ownBox" class="hidden" style="margin-left:34px">
        <div id="ownList"></div>
        <div class="row" style="margin-top:8px"><button class="btn2" id="btnUpload" data-t="own_upload"></button>
          <a class="small" id="ownGuide" target="_blank" rel="noopener" style="align-self:center"></a></div>
        <input type="file" id="ownFile" accept=".wasm,.wat" class="hidden">
        <div class="out" id="ownOut"></div>
      </div>
    </div>

    <div class="card">
      <h2><span class="step">3</span><span data-t="what_h"></span></h2>
      <p class="lead" data-t="what_lead"></p>
      <div id="scenarios"></div>
      <label class="f"><span data-t="words_l"></span><textarea id="words"></textarea></label>
      <div class="counter" id="wordsCount"></div>
    </div>

    <div class="card">
      <details class="params"><summary data-t="params_h"></summary>
        <div class="param"><label class="f"><span data-t="budget_l"></span><input type="number" id="budget" value="625" min="20"></label>
          <div class="hint" data-t="budget_h"></div></div>
        <div class="param"><label class="f"><span data-t="answer_l"></span><input type="number" id="answer" value="1024" min="16" max="1024"></label>
          <div class="hint" data-t="answer_h"></div></div>
        <div class="param"><label class="f"><span data-t="timeout_l"></span><input type="number" id="timeout" value="0" min="0" max="3600"></label>
          <div class="hint" data-t="timeout_h"></div></div>
        <div class="param"><label class="f"><span data-t="second_l"></span>
          <select id="second"><option value="молчит" data-t="second_idle"></option><option value="такой же" data-t="second_acts"></option></select></label>
          <div class="hint" data-t="second_h"></div></div>
        <div class="param"><label class="f"><span data-t="seed_l"></span><input type="number" id="seed" value="1" min="0"></label>
          <div class="hint" data-t="seed_h"></div></div>
        <div class="param" id="tokParam"><label class="f"><span data-t="tokens_l"></span><input type="number" id="maxTokens" min="16"></label>
          <div class="hint" data-t="tokens_h"></div></div>
      </details>
      <details class="params" id="exchangeBox">
        <summary data-t="exchange_h"></summary>
        <div class="hint" data-t="exchange_help"></div>
        <div class="row">
          <button id="btnExchangeNew" type="button" data-t="exchange_new"></button>
          <button id="btnExchangeDetach" type="button" data-t="exchange_detach" disabled></button>
        </div>
        <div class="row">
          <label class="f"><span data-t="exchange_id"></span><input type="text" id="exchangeId" maxlength="32"></label>
          <button id="btnExchangeOpen" type="button" data-t="exchange_open"></button>
          <button id="btnExchangeRefresh" type="button" data-t="exchange_refresh" disabled></button>
        </div>
        <div id="exchangePath" class="small"></div>
        <label id="exchangeWasmRow" class="f hidden">
          <span data-t="exchange_wasm"></span><input type="checkbox" id="exchangeWasm">
        </label>
        <input id="exchangeFiles" type="file" multiple disabled>
        <div id="exchangeStatus" class="hint" role="status"></div>
        <div id="exchangeCloudFiles" class="hidden"></div>
        <div id="exchangeResults"></div>
      </details>
      <button class="start" id="btnStart" data-t="start"></button>
      <div class="why" id="why"></div>
    </div>
  </section>

  <section id="right">
    <div id="notes"></div>
    <div class="card how" id="how"></div>
    <div class="card hidden" id="statusCard">
      <div class="status">
        <div class="what"><div class="state" id="state"></div><div class="act" id="act"></div></div>
        <button class="stopbtn hidden" id="btnStop" data-t="stop"></button>
      </div>
      <div class="nums" id="nums"></div>
    </div>
    <div class="card hidden" id="verdictCard"></div>
    <div class="card hidden" id="movesCard">
      <h2 data-t="moves_h"></h2>
      <p class="lead" data-t="moves_lead"></p>
      <div class="tabs hidden" id="tabs"></div>
      <div id="moves"></div>
    </div>
  </section>
</main>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const bytes = (s) => new TextEncoder().encode(s).length;
const fill = (s, p) => String(s).replace(/\{(\w+)\}/g, (_, k) => (p && p[k] !== undefined && p[k] !== null ? p[k] : ""));

// ---------------------------------------------------------------- строки экрана
const T = {
 ru: {
  title: "Пространство", subtitle: "песочница для ИИ-агентов", how_link: "Как это устроено",
  exchange_h: "Файлы обмена", exchange_help: "Создай папку и добавь файлы перед запуском. Готовые файлы появятся после подтверждения каждой выдачи.",
  exchange_new: "Создать папку", exchange_detach: "Отключить", exchange_id: "Номер сеанса", exchange_open: "Открыть", exchange_refresh: "Обновить файлы",
  exchange_cloud_need: "Выбери версии для облака и провайдера из списка.",
  exchange_cloud_files: "Версии, разрешённые для облака в этом сеансе",
  exchange_cloud_confirm: "Разрешить отправку текста задания и данных выбранных версий в {provider} ({model}) для этого сеанса?\n{files}",
  exchange_gateway_unavailable: "Файловый облачный шлюз требует рабочую печать сети.", exchange_wasm: "Запустить свой Wasm без модели",
  exchange_inbox: "Вход", exchange_outbox: "Выход", exchange_approve: "Подтвердить выдачу", exchange_download: "Скачать",
  exchange_confirm: "Выдать файл «{name}» в outbox?", exchange_uploaded: "Добавлено файлов: {count}",
  exchange_empty: "Нет оплаченных заявок на выдачу.", exchange_processing: "Ожидается итог проверки.",
  model_h: "Модель", local: "Локальная", local_sub: "файл GGUF из доверенного источника", cloud: "Облачная",
  cloud_sub: "по адресу и ключу",
  local_explain: "Модель запускается через Bubblewrap с отдельной сетью, файловой системой и пространством процессов.",
  local_noseal: "Для локальной модели требуется рабочий Bubblewrap (bwrap): {why}.",
  cloud_explain: "Модель у поставщика или в отдельной программе на этом компьютере (Ollama, LM Studio). Вопросы агента уходят ей по сети — каждый оплачен из бюджета агента и записан в журнал до отправки. У самой песочницы сети нет.",
  found: "Найдено в папке моделей:", nofound: "В папке моделей пока нет файлов. Укажи путь к своему файлу или скачай по ссылке.",
  path_l: "Или путь к файлу .gguf на этом компьютере", url_l: "Или скачать по ссылке — например, с huggingface.co",
  download: "Скачать", dl_going: "Качаю {name}: {pct}", dl_done: "Скачано: {name}. Контрольная сумма SHA-256: {sha}",
  dl_err: "Не скачалось: {e}",
  engine: "Для файлов моделей нужен движок. Один раз, в терминале: python3 start.py --local",
  provider_l: "Поставщик", address_l: "Адрес", modelname_l: "Имя модели", list: "Список", key_l: "Ключ доступа",
  key_ph: "не сохраняется", key_none: "ключ не нужен",
  key_env: "Ключ взят из переменной {env} — поле можно оставить пустым.",
  key_hint: "Ключ живёт в памяти программы до конца прогона и никуда не пишется. Можно задать его до запуска переменной {env}.",
  check: "Проверить связь", checking: "Спрашиваю…", check_ok: "Связь есть, модель ответила: «{a}»", check_no: "Нет связи: {e}",
  listing: "Спрашиваю список…", listed: "Моделей: {n}. Начни вводить имя — появятся подсказки.",
  ollama: "Ollama на этом компьютере", lmstudio: "LM Studio на этом компьютере", other: "Другой (протокол OpenAI)",
  agent_h: "Агент", builtin: "Встроенный агент",

      const R = {"чтение": ru ? "прочитал «{o}»" : "read “{o}”", "запись": ru ? "записал «{o}»" : "wrote “{o}”",
        "сдача ответа": ru ? "ответ принят и ушёл в выход" : "the answer was accepted and sent to the output",
        "создание помощника": ru ? "помощник запущен" : "the helper was started",
        "резольвер: имя из описи": ru ? "среда нашла такое имя" : "the environment found that name",
        "передача ссылки": ru ? "передал ссылку" : "passed a reference", "чтение ссылки": ru ? "взял ссылку" : "took a reference"};
      return {cls: "ok", text: fill(R[ev.rule] || `${ev.rule}: {o}`, {o: ev.obj})};
    }
    case "отказ ворот":
      return {cls: "bad", text: fill(ru ? "среда отказала: {w} (код {c}); попытка стоила {p}" : "the environment refused: {w} (code {c}); the attempt cost {p}",
        {w: CODE[L][String(ev.code)] || "?", c: ev.code, p: ev.charge ?? 0})};
    case "проверка":
      return {cls: "info", text: fill(ru ? "среда проверяет ответ на часть {p} задачи {t} за счёт {who}" : "the environment checks the answer to part {p} of task {t}, paid by {who}",
        {p: ev.part, t: ev.task, who: T[L][ev.payer === "агент" ? "payer_agent" : "payer_env"]})};
    case "отказ":
      return {cls: "bad", text: ev.task !== undefined
        ? fill(ru ? "ответ не принят: {w}; агент платит {c}" : "the answer was not accepted: {w}; the agent pays {c}",
               {w: (SUBMIT_WHY[L][ev.why] || ev.why || "?"), c: ev.charge ?? 0})
        : fill(ru ? "{r} не принял доставку; плата {c}" : "{r} refused the delivery; cost {c}", {r: recv(ev.receiver), c: ev.charge ?? 0})};
    case "списание":
      return {cls: "info", text: fill(ru ? "за доставку в {r} списано {p}" : "{p} charged for delivery to {r}", {r: recv(ev.receiver), p: ev.price})};
    case "завершено": return {cls: "ok", text: ru ? "доставлено" : "delivered"};
    case "работа":
      return {cls: "ok", text: fill(ru ? "узел {n} вычислен{f}; плата {p}" : "node {n} computed{f}; cost {p}",
        {n: ev.node, p: ev.price, f: ev.first ? (ru ? " впервые" : " for the first time") : ""})};
    case "выброс": return {cls: "info", text: fill(ru ? "узел {n} выброшен" : "node {n} dropped", {n: ev.node})};
    case "останов": return {cls: "bad", text: ru ? "бюджет кончился — агент остановлен" : "the budget ran out — the agent was stopped"};
    default: return {cls: "info", text: ev.kind};
  }
}

function moveMeaning(move, line, L) {
  const M = MOVE[L];
  if (!move) return "";
  const nums = (line.match(/-?\d+/g) || []);
  if (move === "ДОСТАВЬ") return fill(M[/\s[EЕ]\s*$/i.test(line) ? "ДОСТАВЬ_E" : "ДОСТАВЬ_OUT"], {a: nums[0] ?? (L === "ru" ? "(без номера)" : "(no number)")});
  if (move === "СПРАВКА") return fill(M["СПРАВКА"], {name: line.replace(/^[^А-ЯЁа-яё]*СПРАВКА\s*/i, "").trim().slice(0, 40)});
  const none = L === "ru" ? "(без номера)" : "(no number)";
  return fill(M[move] ?? "", {a: nums[0] ?? none, b: nums[1] ?? none});
}

async function api(path, body) {
  const opt = body === undefined ? {headers: {"X-Token": TOKEN}}
    : {method: "POST", headers: {"X-Token": TOKEN, "content-type": "application/json"}, body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({error: `HTTP ${r.status}`}));
  if (!r.ok) throw new Error((LANG === "en" && j.error_en) || j.error || `HTTP ${r.status}`);
  return j;
}

async function refreshExchange() {

  exchangeJob = info;
  showExchange(); checkReady();
  if (exchangeStarted === id) {
    $("exchangeStatus").textContent = info.issue || (info.ready
      ? (info.requests.length ? "" : t("exchange_empty")) : t("exchange_processing"));
  } else if (info.issue) {
    $("exchangeStatus").textContent = info.issue;
  }
}

  $("exchangeId").value = id || "";

async function openExchange(id) {

async function addExchangeFiles() {
  const input = $("exchangeFiles"), id = exchangeJob?.id;
  if (!id) return;
  const selected = Array.from(input.files);
  input.disabled = true;
  $("btnStart").disabled = true;
  let count = 0;
  try {
    for (const file of selected) {
      if (file.size > 65536) throw new Error(LANG === "ru" ? "Файл больше 64 КиБ" : "File exceeds 64 KiB");
      const bytes = new Uint8Array(await file.arrayBuffer());
      let raw = "";
      for (const byte of bytes) raw += String.fromCharCode(byte);
      await api("/api/exchange/upload", {id, name: file.name, data: btoa(raw)});
      count++;
    }
    await refreshExchange();
    $("exchangeStatus").textContent = t("exchange_uploaded", {count});
  } catch (e) {
    $("exchangeStatus").textContent = t("exchange_uploaded", {count}) + ". " + e.message;
  } finally {
    input.value = "";
    showExchange();
    checkReady();
  }
}

  button.disabled = true;

    await api("/api/exchange/approve", {id: exchangeJob.id, request: item.id});
    await refreshExchange();
  } catch (e) {
    $("exchangeStatus").textContent = e.message;
    button.disabled = false;
  }
}

async function download() {
  const url = $("url").value.trim();
  if (!url) return;
  $("btnDl").disabled = true; $("dlOut").className = "out";
  let name;
  try { name = (await api("/api/download", {url})).name; }
  catch (e) { $("dlOut").className = "out bad"; $("dlOut").textContent = t("dl_err", {e: e.message}); $("btnDl").disabled = false; return; }
  const timer = setInterval(async () => {
    const d = (await api("/api/downloads"))[name];
    if (!d) return;
    if (d.state === "идёт") {
      const pct = d.total ? Math.round(100 * d.done / d.total) + "%" : Math.round(d.done / 1048576) + " MB";
      $("dlOut").textContent = t("dl_going", {name, pct});
      return;
    }
    clearInterval(timer); $("btnDl").disabled = false;
    if (d.state === "ошибка") { $("dlOut").className = "out bad"; $("dlOut").textContent = t("dl_err", {e: d.error}); return; }
    $("dlOut").className = "out good"; $("dlOut").textContent = t("dl_done", {name, sha: d.sha256});
    INFO = await api("/api/info");
    const m = INFO.models.find((x) => x.name === name); if (m) { localPick = m.path; $("path").value = ""; }
    renderLocal(); checkReady();
  }, 800);
}

    if (exchangeJob && exchangeStarted === exchangeJob.id) why = t("exchange_new");

      if (!INFO.exchange_wasm_ok) why = t("no_local");

// ---------------------------------------------------------------- прогон
async function start() {
  const b = {contour, words: $("words").value, budget: Number($("budget").value), answer: Number($("answer").value),
    timeout: Number($("timeout").value), seed: Number($("seed").value), second: $("second").value,
    agent: agentKind === "own" ? ownPick : "встроенный", agent_lang: $("agentLang").value};
  if (contour === "сомкнутый") {
    b.model = ownWithoutModel() ? "" : modelPath();
  } else {
    Object.assign(b, cloudBody());
    if (exchangeJob) {
      const versions = cloudExchangeVersions();
      const preset = presetObj();
      const files = versions.map(f => `${f.name} · ${f.sha256}`).join("\n");
      if (!versions.length || !confirm(t("exchange_cloud_confirm", {provider: preset.name, model: b.cloud.model, files}))) return;
      b.cloud_export = {provider: preset.id, files: versions.map(({name, sha256}) => ({name, sha256}))};
    }
  }
  if (exchangeJob) b.exchange = exchangeJob.id;
  try { await api("/api/start", b); }
  catch (e) { $("why").textContent = e.message; return; }
  running = true; since = 0; events = []; LAST = null; tab = 1; movesKey = ""; openRaw.clear(); openGroups.clear();
  if (b.exchange) exchangeStarted = b.exchange;
  showExchange();
  $("how").classList.add("hidden"); $("notes").innerHTML = "";
  checkReady(); poll = setInterval(tick, 700); tick();
}
async function stop() { $("btnStop").disabled = true; try { await api("/api/stop", {}); } catch (e) {} }

async function tick() {
  let r;
  try { r = await api("/api/run?since=" + since); } catch (e) { return; }
  if (r.state === "нет") return;
  clockSkew = Date.now() / 1000 - r.now;
  events.push(...r.events); since = r.next; r.events = [];
  LAST = r; render(r);
  if (["готово", "остановлено", "ошибка"].includes(r.state) && r.complete !== false) {
    clearInterval(poll); running = false; showExchange(); checkReady();
    if (r.settings.exchange && exchangeJob?.id === r.settings.exchange) {
      exchangeStarted = r.settings.exchange;
      await refreshExchange().catch(e => { $("exchangeStatus").textContent = e.message; });
    }
  }
}

function kb(n) { return n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`; }
const sec = () => (LANG === "ru" ? "с" : "s");
function clock(s) { s = Math.max(0, Math.round(s)); return s < 60 ? `${s} ${sec()}` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
const live = (r) => ["готовится", "идёт", "проверка законов"].includes(r.state);

function render(r) {
  $("notes").innerHTML = r.notes.map((n) => `<div class="note ${["cloud_failed", "host_crash", "closed_impossible", "model_sandbox_unavailable"].includes(n.code) ? "bad" : "warn"}">${esc(t("n_" + n.code, {why: n.why}))}</div>`).join("");
  $("statusCard").classList.remove("hidden");
  const st = {"проверка законов": "st_check", "готово": "st_done", "остановлено": "st_stopped", "ошибка": "st_error"}[r.state] || "st_run";
  $("state").textContent = t(st);
  $("btnStop").classList.toggle("hidden", !live(r)); $("btnStop").disabled = !live(r);
  updateActivity();
  const two = r.settings.second === "такой же", c = r.tally[tab] || r.tally[1], b = r.settings.budget;
  const ref = Object.values(c.refusals).reduce((x, y) => x + y, 0);
  $("nums").innerHTML = `
    <div class="num"><div class="v">${c.left}</div><div class="k">${t("n_budget")} ${t("n_of", {b})}</div>
      <div class="bar"><i style="width:${Math.max(0, Math.min(100, 100 * c.left / b))}%"></i></div></div>
    <div class="num"><div class="v">${c.questions}</div><div class="k">${t("n_q")}</div></div>
    <div class="num"><div class="v">${kb(c.bytes_to_model)}</div><div class="k">${t("n_sent")}</div></div>
    <div class="num"><div class="v">${ref}</div><div class="k">${t("n_ref")}</div></div>
    <div class="num"><div class="v">${c.accepted}</div><div class="k">${t("n_acc")}</div></div>`;
  $("movesCard").classList.remove("hidden");
  $("tabs").classList.toggle("hidden", !two);
  const key = `${events.length}|${tab}|${LANG}`;
  if (key !== movesKey) {          // перерисовывать ходы только когда есть новое
    movesKey = key;
    $("tabs").innerHTML = [1, 2].map((i) => `<button data-tab="${i}" class="${tab === i ? "on" : ""}">${t("agent_n", {n: i})}</button>`).join("");
    for (const btn of document.querySelectorAll("[data-tab]")) btn.onclick = () => { tab = Number(btn.dataset.tab); render(LAST); };
    $("moves").innerHTML = movesHtml(tab);
  }
  renderVerdict(r);
}

// Предел токенов, с которым шёл прогон: заданный или по умолчанию (половина предела ответа).
function cutLimit() {
  const c = LAST && LAST.settings && LAST.settings.cloud;
  return c && c.max_tokens ? c.max_tokens : "?";
}

function movesHtml(i) {
  const own = LAST && LAST.settings.agent !== "встроенный";
  const turns = {}, pre = [];
  for (const ev of events) {
    if (ev.contour !== i) continue;
    if (ev.type === "turn") turns[ev.n] = {n: ev.n, q: ev, a: null, fx: []};
    else if (ev.type === "answer" && turns[ev.n]) turns[ev.n].a = ev;
    else if ((ev.type === "effect" || ev.type === "agent") && turns[ev.n]) turns[ev.n].fx.push(ev);
    else if (ev.type === "effect" && !ev.n) pre.push(ev);
  }
  const fxHtml = (e) => e.type === "agent" ? `<div class="agent">${esc(t("agent_said", {t: e.text}))}</div>`
    : (() => { const x = effectText(e, LANG); return `<div class="${x.cls}">${esc(x.text)}</div>`; })();
  let html = Object.values(turns).sort((x, y) => y.n - x.n).map((tu) => {
    const a = tu.a, k = `${i}-${tu.n}`;
    const said = !a ? `<span class="said none">${t("asking_now")}</span>`
      : a.move === "молчит" ? `<span class="said none">${esc(MOVE[LANG]["молчит"])}</span>`
      : `<span class="said">${esc(a.line || "…")}</span>`;
    const means = a && a.move !== "молчит" && !own ? moveMeaning(a.move, a.line || "", LANG) : "";
    const fx = tu.fx.map(fxHtml).join("");
    const raw = `<details class="raw" data-k="${k}" ${openRaw.has(k) ? "open" : ""}><summary>${t("raw")}</summary>
      <div class="small">${t("q_cap", {b: tu.q.q_len, f: tu.q.fee})}</div><pre>${esc(tu.q.q)}</pre>`
      + (a && a.a !== null ? `<div class="small">${t("a_cap")}</div><pre class="m">${esc(a.a)}</pre>` : "") + `</details>`;
    return `<div class="turn"><div class="top"><span class="no">${t("turn", {n: tu.n})}</span>${said}<span class="secs">${a ? a.seconds + " " + sec() : ""}</span></div>
      ${means ? `<div class="means">${esc(means)}</div>` : ""}${a && a.cut ? `<div class="cut">${esc(t("cut", {n: cutLimit()}))}</div>` : ""}${fx ? `<div class="fx">${fx}</div>` : ""}${raw}</div>`;
  }).join("");
  if (pre.length) html += `<div class="turn"><div class="top"><span class="pre0">${t(own ? "before_own" : "before")}</span></div><div class="fx">${pre.map(fxHtml).join("")}</div></div>`;
  return (own ? `<p class="small">${t("own_moves")}</p>` : "") + html;
}

function renderVerdict(r) {
  const v = $("verdictCard");
  if (live(r)) { v.classList.add("hidden"); return; }
  v.classList.remove("hidden");
  const links = `<p class="small">${r.state === "ошибка" ? "" : `<a href="/api/zip/${r.id}?t=${TOKEN}">${t("zip")}</a> · `}<a href="#" id="again">${t("again")}</a></p>`;
  if (r.state !== "готово" || !r.result || r.result.stopped) {
    const stopped = r.state === "остановлено";
    v.innerHTML = `<div class="verdict bad"><b>${t(stopped ? "st_stopped" : "st_error")}</b>${t(stopped ? "stopped_text" : "error_text")}</div>${links}`;
  } else {
    const res = r.result, ok = res.broken.length === 0;
    const head = ok ? `<b>${t("verdict_ok")}</b>${t("verdict_ok_sub", {h: res.laws_holds, na: res.laws_na})}` : `<b>${t("verdict_bad", {k: res.broken.join(", ")})}</b>`;
    const G = Object.fromEntries(INFO.groups.map((g) => [g.id, g]));
    const dot = (s) => s === "держится" ? "h" : s === "нарушен" ? "b" : "";
    const stname = (s) => t(s === "держится" ? "st_h" : s === "нарушен" ? "st_b" : "st_na");
    const groups = res.groups.map((g) => {
      const [title, about] = G[g.id][LANG];
      const held = g.items.filter((x) => x.status === "держится").length;
      return `<div class="group"><div class="gh" data-g="${g.id}"><span class="dot ${dot(g.status)}"></span><span class="t">${esc(title)}</span>
        <span class="c">${t("laws_n", {h: held, n: g.items.length})}</span></div><div class="ga">${esc(about)}</div>
        <div class="laws ${openGroups.has(g.id) ? "" : "hidden"}">${g.items.map((x) => `<div class="law"><span class="dot ${dot(x.status)}" style="margin-top:6px"></span>
          <div>${esc((INFO.laws[x.key] || ["", ""])[LANG === "ru" ? 0 : 1])} <span class="st">— ${stname(x.status)}${x.status === "нарушен" ? ": " + esc(x.detail) : ""}</span></div>
          <span class="key">${esc(x.key)}</span></div>`).join("")}</div></div>`;
    }).join("");
    const audit = res.audit.length ? t("audit_bad", {e: res.audit.join("; ")}) : t("audit_ok");
    const seal = res.seal ? t("seal_ok") : res.net === "netns" && !res.open ? t("seal_netns") : t("seal_none");
    const tok = res.tokens ? `<p class="small">${t("tokens", {i: res.tokens.in, o: res.tokens.out})}</p>` : "";
    v.innerHTML = `<div class="verdict ${ok ? "ok" : "bad"}">${head}</div>
      <p class="small">${t("verdict_explain")}</p><p class="small">${audit} ${seal}</p>
      ${res.open ? `<p class="small">${t("open_note")}</p>` : ""}${tok}${groups}${links}`;
    for (const gh of v.querySelectorAll(".gh")) gh.onclick = () => {
      const id = gh.dataset.g; openGroups.has(id) ? openGroups.delete(id) : openGroups.add(id);
      gh.parentElement.querySelector(".laws").classList.toggle("hidden");
    };
  }
  $("again").onclick = (e) => { e.preventDefault(); newRun(); };
}

function newRun() {
  LAST = null; events = []; movesKey = "";
  for (const id of ["statusCard", "verdictCard", "movesCard"]) $(id).classList.add("hidden");
  $("notes").innerHTML = ""; $("how").classList.remove("hidden");
  api("/api/info").then((i) => { INFO = i; renderLocal(); checkReady(); });
  window.scrollTo(0, 0);
}

// Строка хода меняется, пока идёт шаг: застывшая строка читается человеком
// как «зависло», даже когда работа идёт.
function updateActivity() {
  if (!LAST) return;
  const a = LAST.activity, now = Date.now() / 1000 - clockSkew, on = live(LAST);
  const text = t("a_" + a.code, {c: a.contour, n: a.n});
  const parts = [];
  if (text) parts.push(on ? `${text} · ${clock(now - a.since)}` : text);
  parts.push(t("elapsed", {t: clock((on ? now : LAST.now) - LAST.t0)}));
  $("act").textContent = parts.join("    ·    ");
}
setInterval(() => { if (running) updateActivity(); }, 250);

// раскрытое «целиком» не схлопывается при обновлении списка
document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (d.classList && d.classList.contains("raw")) d.open ? openRaw.add(d.dataset.k) : openRaw.delete(d.dataset.k);
}, true);

// ---------------------------------------------------------------- начало
async function init() {
  for (const b of document.querySelectorAll("[data-lang]")) b.onclick = () => {
    LANG = b.dataset.lang; try { localStorage.setItem("prostranstvo_lang", LANG); } catch (e) {}
    const s = INFO && INFO.scenarios.find((x) => x.id === scenario);
    applyLang();
    if (s) $("words").value = s[LANG].words, countWords();
  };
  applyLang();
  try { INFO = await api("/api/info"); } catch (e) { $("how").textContent = e.message; return; }
  $("preset").onchange = onPreset;
  for (const b of $("seg").children) b.onclick = () => setContour(b.dataset.c);
  $("words").oninput = () => { if (scenario !== "own") { scenario = "own"; renderScenarios(); } countWords(); };
  $("path").oninput = () => { if ($("path").value.trim()) { localPick = ""; renderLocal(); } checkReady(); };
  for (const id of ["base", "model", "key"]) $(id).oninput = checkReady;
  $("btnDl").onclick = download; $("btnModels").onclick = listModels; $("btnCheck").onclick = checkCloud;
  $("btnStart").onclick = start; $("btnStop").onclick = stop;
  $("btnExchangeNew").onclick = prepareExchange;
  $("btnExchangeDetach").onclick = () => {
    exchangeJob = null; exchangeStarted = null; cloudFileSelection.clear(); rememberExchange(null); showExchange(); checkReady();
  };
  $("btnExchangeOpen").onclick = () => openExchange($("exchangeId").value.trim());
  $("btnExchangeRefresh").onclick = () => refreshExchange().catch(e => { $("exchangeStatus").textContent = e.message; });
  $("exchangeFiles").onchange = addExchangeFiles;
  $("exchangeWasm").onchange = checkReady;
  for (const r of document.querySelectorAll("input[name=ag]")) r.onchange = () => setAgent(r.value);
  $("btnUpload").onclick = () => $("ownFile").click(); $("ownFile").onchange = uploadOwn;
  $("agentLang").onchange = () => { agentLangTouched = true; };
  $("btnHow").onclick = () => { $("how").classList.remove("hidden"); $("how").scrollIntoView({behavior: "smooth"}); };
  if (INFO.models.length) localPick = INFO.models[0].path;
  renderPresets(); $("base").value = presetObj().base;
  if (INFO.own_agents.length) ownPick = INFO.own_agents[0].name;
  applyLang(); setAgent("builtin");
  pickScenario("work");
  setContour(INFO.closed_ok ? "сомкнутый" : "разомкнутый");
  const r = await api("/api/run?since=0");
  let remembered = null;
  try { remembered = localStorage.getItem("prostranstvo_exchange"); } catch (e) {}
  const exchangeId = r.settings?.exchange || remembered;
  if (exchangeId) {
    if (r.settings?.contour) setContour(r.settings.contour);
    await openExchange(exchangeId);
  }
  if (r.state && !["нет", "готово", "остановлено", "ошибка"].includes(r.state)) {      // страницу открыли заново посреди прогона
    running = true; $("how").classList.add("hidden"); checkReady(); poll = setInterval(tick, 700); tick();
  }
}
init();
</script>
