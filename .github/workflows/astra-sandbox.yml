name: Проверка Sandbox с Astra

on:
  workflow_dispatch:
    inputs:
      live:
        description: Вызвать настоящую Astra (расход API-кредитов)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sandbox:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: prostranstvo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Проверка установки без облачных запросов
        run: |
          set -o pipefail
          python3 start.py --check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Прогон оплачиваемого файлового обмена с Astra
        if: inputs.live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          .venv/bin/python3 -m experiments.astra_acceptance | tee -a "$GITHUB_STEP_SUMMARY"
