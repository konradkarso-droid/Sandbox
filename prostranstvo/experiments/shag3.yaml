# Шаг 3 «Теории среды»: измельчение действий и зависимости (M3).
# Все числа объявлены, а не подобраны (docs/shag3_specifikatsiya.md, §7).
# Пределы по размеру — то, что точный поиск успевает на этой машине.

model: "мир M3"
hypotheses: ["Г", "Ц3", "Ц4", "Ц5", "Ц6", "П1"]
price_per_step: 1

table:
  graphs: ["M3ц", "M3т", "M3а", "M3б"]
  levels: [3, 4, 5]
  memory: [1, 2, 3, 4, 5, 6, 7]
  keep_path_below_states: 1500000   # путь наименьшей работы сохраняется только для небольших поисков

# Законные сокращения и абляция «без провенанса» — на тех же графах,
# с пределом памяти, при котором поиск укладывается во время.
shortcuts:
  graphs: ["M3ц", "M3т"]
  С1: {levels: [3, 4, 5], memory_max: {3: 7, 4: 7, 5: 4}}
  С2: {levels: [3, 4, 5], memory_max: {3: 7, 4: 4, 5: 3}}
  С3: {levels: [3, 4, 5], memory_max: {3: 7, 4: 7, 5: 6}}

# Порчи: мир, где правильная среда замкнута (M=3), и мир с пересчётом (M=4).
defects:
  graph: "M3т"
  levels: 4
  memory: [3, 4]
  max_states: 1500000

crosscheck:
  levels: [2, 3, 4]
  memory: [1, 2, 3, 4, 5, 6]
